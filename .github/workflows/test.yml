name: Test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        # Test against exactly what the manifest pins, not the newest release.
        run: |
          pip install pytest pytest-asyncio homeassistant
          pip install $(jq -r '.requirements[]' custom_components/landbook/manifest.json)

      - name: Run tests
        run: pytest
